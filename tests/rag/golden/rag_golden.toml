# RAG Golden Dataset —— 固定测试集（40 题）
#
# 用途：任何改动 Chunking / Embedding / Retriever / Reranker / Query Rewrite 之后，
# 用同一套题目重新跑评测，判断「变好还是变差」（用法见 tests/rag/README.md）。
#
# 三个必守约定（否则数据集会静默失效）：
# 1. `expected_evidence` 必须**逐字**来自原文档（建议整句复制），且不跨 chunk 边界
#    —— 判定按「内容包含」而非 chunk 主键，因此重新切分后依然有效；
# 2. `expected_source` 用**文档名**（比 document_id 稳定），同一主题多文档时列全；
# 3. 无答案题（`expected_behavior = "abstain"`）**不要**填 evidence/source
#    —— 这类题不参与 Recall/MRR，只判「是否拒答」。
#
# 修改数据集后务必跑：.venv/bin/pytest tests/rag/test_golden_dataset.py -q
# 新增题目后建议跑一次完整检索评测（会重新核对证据子串是否真的能命中）。

version = 1

# 回归门禁阈值（baseline，2026-09-21 首次实测后校准）
#
# 实测（默认配置：hybrid 开 / rerank 关 / rewrite 关；40 题）：
#   hit@5 = 0.882   evidence_recall@5 = 0.868   mrr = 0.805
# 门禁 = 实测约 -10% 余量：用于吸收 embedding / 网关抖动与数据集的小幅调整，
# 但仍能抓住真实退化（例如切分改动导致 -20%）。
#
# 约定（改阈值/改数据集前请先读这段）：
# - 只要求「不低于门禁」，**不要求指标必须提升** —— 这是回归门禁，不是性能目标；
# - `hit@1` 实测 0.735，**不加入硬门禁**，但保留在报告与对比表中观察；
# - ⚠️ 一旦 rerank / rewrite / embedding 模型 / 切分参数 / 本数据集发生实质变化，
#   必须先重新实测（`--tag` 标注变化）→ 再校准阈值 → 再更新 baseline；
#   否则门禁会误报：这些开关会显著改变指标数值。
[thresholds]
hit_at_5 = 0.80
evidence_recall_at_5 = 0.78
mrr = 0.72

