# 生产编排：应用 + 日志栈(Loki/Promtail/Grafana)
# MySQL / Redis 复用宿主机已安装实例（方案 A），通过 host.docker.internal 连接
# 用法：cp .env.example .env 后执行 `docker compose up -d`
# 仅启动应用：`docker compose up -d app`
# 仅启动日志栈：`docker compose up -d loki promtail grafana`

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: business-backend-app
    restart: unless-stopped
    env_file: .env
    extra_hosts:
      # Linux 上 host.docker.internal 需显式映射到宿主机网关（Docker 20.10+）
      - "host.docker.internal:host-gateway"
    environment:
      # 复用宿主机已安装的 MySQL / Redis
      DB_HOST: host.docker.internal
      REDIS_HOST: host.docker.internal
    ports:
      - "8000:8000"
    volumes:
      - file_storage:/app/storage

  # ---- 日志栈：Loki 存储 + Promtail 采集 + Grafana 可视化 ----
  loki:
    image: grafana/loki:3.0.0
    container_name: business-backend-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  promtail:
    image: grafana/promtail:3.0.0
    container_name: business-backend-promtail
    restart: unless-stopped
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker/promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      loki:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.0.0
    container_name: business-backend-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # 首次登录账号 admin，密码见下；生产环境务必通过 .env 覆盖
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      # 自动注册 Loki 数据源，免去手动配置
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - loki

volumes:
  file_storage:
  loki_data:
  grafana_data:
